<!DOCTYPE html>
<html>
    <head>
        <title>Magic Square Solver</title>
        <script type="text/javascript" src="./scripts/main.js"></script>
        <script type="text/javascript" src="./scripts/entities.js"></script>
        <link rel="stylesheet" href="./css/style.css">
        <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">
    </head>
    <body>
        <div class="navbar-container">
            <div class="navbar-centering">
                <div class="logo-container">
                    Magic Square Solver
                </div>
            </div>
        </div>
        <div class="main-container">
            <div id="game-square" class="square-container">

            </div>
            <div class="magic-number-container">
                <div class="magic-number-label">Magic Number:</div>
                <form>
                    <input id="magic-number" class="magic-number" type="text" size="6" maxlength="5" placeholder="34" required/>
                </form>
            </div>
            <div id="number-square" class="square-container">

            </div>
        </div>
    </body>
</html>
